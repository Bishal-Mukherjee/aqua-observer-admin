name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_RUDRA_SERVICE_URL=${{ secrets.NEXT_PUBLIC_RUDRA_SERVICE_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  deploy:
    name: Deploy on EC2 runner
    runs-on: self-hosted
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy container
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          DEPLOY_DIR="${DEPLOY_PATH:-/home/ubuntu/aqua-observer-admin}"
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.prod.yml"

          cd "$DEPLOY_DIR"

          if [ ! -f .env ]; then
            echo "Missing .env in $DEPLOY_DIR — create it with production secrets before deploying."
            exit 1
          fi

          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          export IMAGE_NAME="$IMAGE"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
