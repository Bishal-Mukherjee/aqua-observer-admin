name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production build secrets
        run: |
          missing=()
          [ -z "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" ] && missing+=("NEXT_PUBLIC_API_BASE_URL")
          [ -z "${{ secrets.NEXT_PUBLIC_RUDRA_SERVICE_URL }}" ] && missing+=("NEXT_PUBLIC_RUDRA_SERVICE_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set image name
        id: image
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_RUDRA_SERVICE_URL=${{ secrets.NEXT_PUBLIC_RUDRA_SERVICE_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

  deploy:
    name: Deploy on EC2 runner
    runs-on: self-hosted
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy container
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: ${{ secrets.DB_SSL }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_LOOKUP_PREFIX: ${{ secrets.AWS_S3_LOOKUP_PREFIX }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          TWILIO_SERVICE_SID: ${{ secrets.TWILIO_SERVICE_SID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:${PATH:-}"

          DOCKER_BIN=""
          for candidate in docker /usr/bin/docker /usr/local/bin/docker /snap/bin/docker; do
            if command -v "$candidate" >/dev/null 2>&1; then
              DOCKER_BIN="$(command -v "$candidate")"
              break
            fi
            if [ -x "$candidate" ]; then
              DOCKER_BIN="$candidate"
              break
            fi
          done

          if [ -z "$DOCKER_BIN" ]; then
            echo "::error::docker not found on the self-hosted runner."
            exit 1
          fi

          compose() {
            if "$DOCKER_BIN" compose version >/dev/null 2>&1; then
              "$DOCKER_BIN" compose "$@"
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose "$@"
            elif [ -x /usr/bin/docker-compose ]; then
              /usr/bin/docker-compose "$@"
            else
              echo "::error::docker compose not found on the self-hosted runner."
              exit 1
            fi
          }

          DEPLOY_DIR="${DEPLOY_PATH:-/home/ubuntu/aqua-observer-admin}"
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.prod.yml"

          rm -f "$DEPLOY_DIR/.env"

          cd "$DEPLOY_DIR"

          echo "${{ github.token }}" | "$DOCKER_BIN" login ghcr.io -u "${{ github.actor }}" --password-stdin

          export IMAGE_NAME="$IMAGE"
          compose -f docker-compose.prod.yml pull
          compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
          "$DOCKER_BIN" image prune -f
